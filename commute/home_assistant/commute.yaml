# This defines an explicit action; it does not schedule any polling.
rest_command:
  commute_refresh_live:
    url: !secret commute_live_refresh_url
    method: POST
    headers:
      X-Commute-Refresh: manual
    timeout: 30

  # An automation must use this action, not masquerade as a manual button press.
  # The server will return cache only when no private BMC key is configured.
  commute_auto_refresh_live:
    url: !secret commute_live_refresh_url
    method: POST
    headers:
      X-Commute-Refresh: automatic
    timeout: 30
