# Home Assistant package. Place in /config/packages/commute.yaml.
# Add the two URLs from secrets.example.yaml to your own /config/secrets.yaml.
# GET /api/next is read-only and NEVER refreshes the upstream operator feeds.
rest:
  - resource: !secret commute_next_url
    scan_interval: 60
    timeout: 15
    sensor:
      - name: Commute data
        unique_id: tnt_bn_commute_data
        value_template: "{{ value_json.get('generated_at', 'unavailable') if value_json is mapping else 'unavailable' }}"
        json_attributes:
          - recommendation
          - next_by_operator
          - best_by_operator
          - providers
          - access
          - timetable_coverage
          - walking_included
          - window_minutes
          - count

template:
