      - name: "Commute next shuttle leave home"
        unique_id: tnt_bn_next_shuttle_leave_home_at
        device_class: timestamp
        availability: >-
          {%- set row = (state_attr('sensor.commute_data', 'next_by_operator') or {}).get('shuttle') or {} -%}
          {{ has_value('sensor.commute_data') and row.get('leave_home_at') is not none }}
        state: >-
          {%- set row = (state_attr('sensor.commute_data', 'next_by_operator') or {}).get('shuttle') or {} -%}
          {{ row.get('leave_home_at') or none }}
        attributes:
          line: >-
            {%- set row = (state_attr('sensor.commute_data', 'next_by_operator') or {}).get('shuttle') or {} -%}
            {{ row.get('line') }}
          stop: >-
            {%- set row = (state_attr('sensor.commute_data', 'next_by_operator') or {}).get('shuttle') or {} -%}
            {{ (row.get('origin') or {}).get('name') }}
          bus_departure: >-
            {%- set row = (state_attr('sensor.commute_data', 'next_by_operator') or {}).get('shuttle') or {} -%}
            {{ row.get('departure') }}
